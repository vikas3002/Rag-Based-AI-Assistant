<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 SV Infotech - RAG Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-app">
        <header class="chat-header d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <span class="fs-4">🤖</span>
                <div>
                    <h1 class="h5 m-0 text-info fw-bold">AI Animal Encyclopedia chatbot</h1>
                    <small class="subtitle">Document RAG Assistant</small>
                </div>
            </div>
            <button id="clear-btn" class="btn btn-outline-danger btn-sm d-flex align-items-center gap-1" onclick="clearChat()">
                <i class="bi bi-trash"></i> Clear Chat
            </button>
        </header>

        <div id="chat-box" class="chat-box">
            <div class="message bot">
                <div class="msg-content">
                    👋 <b>Welcome to AI Animal Encyclopedia chatbot!</b><br>
                    Ask me anything based on Animal documents.
                </div>
            </div>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <img src="/static/typing.gif" alt="AI is typing..." />
        </div>

        <div class="input-area">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Type your question about the documents..." 
                autocomplete="off"
                onkeydown="handleKeyPress(event)"
            />
            <button id="send-btn" class="btn btn-info" onclick="sendMessage()">
                <span>Send</span>
                <i class="bi bi-send-fill ms-1"></i>
            </button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
